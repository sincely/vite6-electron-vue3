name: Release

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: '版本类型 (patch / minor / major / alpha / beta)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - alpha
          - beta

env:
  NODE_VERSION: '20'

jobs:
  # ── Job 1: 版本号管理、生成 CHANGELOG、打 Git Tag ──────────────────
  release:
    name: Version & Changelog
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore:')"
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version & create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npx release-it ${{ github.event.inputs.version-type }} --ci
          else
            npx release-it --ci
          fi

      - name: Output new version
        id: get-version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

  # ── Job 2: 多平台并行构建 ────────────────────────────────────────────
  build:
    name: Build · ${{ matrix.platform }}
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false # 某平台失败不中断其他平台
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            build-cmd: npm run build-win:prod
            artifact-name: windows-installer
            # exe / blockmap / latest.yml
            artifact-glob: |
              release/**/*.exe
              release/**/*.blockmap
              release/**/latest.yml

          - platform: macOS
            os: macos-latest
            build-cmd: npm run build-mac:prod
            artifact-name: macos-installer
            # dmg / zip / blockmap / latest-mac.yml
            artifact-glob: |
              release/**/*.dmg
              release/**/*.zip
              release/**/*.blockmap
              release/**/latest-mac.yml

          - platform: Linux
            os: ubuntu-latest
            build-cmd: npm run build-linux:prod
            artifact-name: linux-installer
            # AppImage / blockmap / latest-linux.yml
            artifact-glob: |
              release/**/*.AppImage
              release/**/*.blockmap
              release/**/latest-linux.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository (tagged version)
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.platform }} installer
        run: ${{ matrix.build-cmd }}
        env:
          # electron-builder 上传到 GitHub Release 时需要此 Token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact-name }}-v${{ needs.release.outputs.version }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.zip
            release/**/*.AppImage
            release/**/*.blockmap
            release/**/latest*.yml
          retention-days: 30
