<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self' 'unsafe-eval' blob: https://unpkg.com;
      style-src 'self' 'unsafe-inline';
      img-src * data:;
      connect-src 'self' blob: http://localhost:5320 ws://localhost:5320 https://unpkg.com https://api.iconify.design https://api.unisvg.com https://api.simplesvg.com data:;
      worker-src 'self' blob:;
      media-src 'self';
      frame-src https: http:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    "
    />
    <style>
      /* 首屏启动画面：纯 CSS，HTML 到达即渲染，无需等待 JS。
         设计语言与应用图标一致（三蓝折叠环），Vue 挂载时随 #app 内容一起被替换。
         背景色必须与 --color-bg-window 保持一致，避免挂载瞬间出现底色跳变 */
      .app-boot-splash {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background:
          radial-gradient(
            circle at 76% 20%,
            rgb(37 99 235 / 5%),
            transparent 52%
          ),
          #ffffff;
      }

      .app-boot-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: app-boot-enter 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .app-boot-splash-mark {
        width: 72px;
        height: auto;
      }

      /* 与应用图标一致：三蓝折叠环依靠 multiply 产生交叠层次（仅浅色底有效，
         深色底下在媒体查询中还原为 normal） */
      .app-boot-splash-mark path {
        mix-blend-mode: multiply;
      }

      .app-boot-splash-track {
        position: relative;
        width: 88px;
        height: 2px;
        margin-top: 30px;
        overflow: hidden;
        background: #e7edf6;
        border-radius: 2px;
      }

      .app-boot-splash-track::before {
        position: absolute;
        top: 0;
        left: 0;
        width: 30px;
        height: 100%;
        content: '';
        background: linear-gradient(
          90deg,
          transparent,
          #2563eb 30%,
          #2563eb 70%,
          transparent
        );
        border-radius: 2px;
        animation: app-boot-comet 1.4s cubic-bezier(0.37, 0, 0.2, 1) infinite;
      }

      @keyframes app-boot-enter {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.96);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes app-boot-comet {
        from {
          transform: translateX(-30px);
        }

        to {
          transform: translateX(88px);
        }
      }

      @media (prefers-color-scheme: dark) {
        .app-boot-splash {
          background:
            radial-gradient(
              circle at 76% 20%,
              rgb(59 130 246 / 8%),
              transparent 52%
            ),
            #0b0c0f;
        }

        .app-boot-splash-mark path {
          mix-blend-mode: normal;
        }

        .app-boot-splash-track {
          background: #1c2433;
        }

        .app-boot-splash-track::before {
          background: linear-gradient(
            90deg,
            transparent,
            #3b82f6 30%,
            #3b82f6 70%,
            transparent
          );
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-splash-content {
          animation: none;
        }

        .app-boot-splash-track::before {
          width: 45%;
          animation: none;
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot-splash" aria-hidden="true">
        <div class="app-boot-splash-content">
          <svg

            />
            <path
              d="M90.67 102.83L44.93 129.04Q37.82 133.12 44.95 137.17L70.49 151.66Q77.62 155.71 84.72 151.61L129.93 125.51Q137.03 121.41 129.93 117.31L104.88 102.85Q97.78 98.75 90.67 102.83Z"

          <div class="app-boot-splash-track"></div>

  </body>
</html>
